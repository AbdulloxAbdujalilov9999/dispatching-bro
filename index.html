<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haulwise Dispatch</title>
<meta name="description" content="Freight dispatch: loads, brokers, carriers, drivers, invoices and reports.">
<meta name="theme-color" id="theme-color" content="#f4f6fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haulwise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ============================== THEME ============================== */
:root {
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dfe4f0; --ink:#0f172a; --soft:#5b6785;
  --brand:#2f5be7; --brand-ink:#ffffff; --brand-soft:#e6ecff; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --good:#16a34a; --warn:#d97706; --bad:#dc2626; --radius:12px;
}
:root[data-theme="dark"] {
  --bg:#080d1c; --panel:#10172e; --panel2:#182042; --line:#232d52; --ink:#e8ecf8; --soft:#93a0c4;
  --brand:#4a74ff; --brand-soft:#16234f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --good:#34d17a; --warn:#f5a524; --bad:#f2646b;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
button,input,select,textarea { font:inherit; color:inherit; }
h1,h2,h3 { margin:0; line-height:1.25; }

/* ============================== LAYOUT ============================== */
#app { display:flex; min-height:100vh; }
.sidebar { width:236px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
.brand { display:flex; align-items:center; gap:10px; padding:4px 10px 16px; font-weight:700; font-size:16px; }
.logo { width:32px; height:32px; flex:none; } .logo svg { width:100%; height:100%; display:block; }
.nav a { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; color:var(--soft); font-weight:500; text-decoration:none; }
.nav a:hover { background:var(--panel2); color:var(--ink); }
.nav a.active { background:var(--brand-soft); color:var(--brand); }
.nav-foot { margin-top:auto; padding:10px; font-size:12px; color:var(--soft); }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { display:none; align-items:center; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
.content { padding:28px 32px 60px; width:100%; max-width:1280px; margin:0 auto; }
.scrim { display:none; }
svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

@media (max-width:860px) {
  .sidebar { position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); }
  body.nav-open .sidebar { transform:none; }
  body.nav-open .scrim { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; }
  .topbar { display:flex; }
  .content { padding:18px 16px 50px; }
}

/* ============================== COMPONENTS ============================== */
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.page-head h1 { font-size:24px; letter-spacing:-.01em; }
.page-head p { margin:2px 0 0; color:var(--soft); }
.actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-weight:600; font-size:13px; text-decoration:none; white-space:nowrap; }
.btn:hover { background:var(--panel2); text-decoration:none; }
.btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
.btn.primary:hover { filter:brightness(1.08); }
.btn.danger { color:var(--bad); }
.btn.sm { padding:4px 9px; font-size:12px; border-radius:7px; }
.btn.ghost { border-color:transparent; background:transparent; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.card-pad { padding:18px 20px; }
.card h2 { font-size:15px; margin-bottom:12px; }
.grid { display:grid; gap:16px; }
.g4 { grid-template-columns:repeat(4,1fr); } .g3 { grid-template-columns:repeat(3,1fr); } .g2 { grid-template-columns:repeat(2,1fr); } .g21 { grid-template-columns:2fr 1fr; }
@media (max-width:1000px) { .g4 { grid-template-columns:repeat(2,1fr); } .g3,.g21 { grid-template-columns:1fr; } }
@media (max-width:640px) { .g4,.g2 { grid-template-columns:1fr; } }
.stat { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; }
.stat .k { color:var(--soft); font-size:12.5px; } .stat .v { font-size:24px; font-weight:700; letter-spacing:-.02em; margin-top:2px; }
.stat .ic { width:38px; height:38px; border-radius:10px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; }
.toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.input,.select,.textarea { width:100%; padding:8px 11px; border-radius:9px; border:1px solid var(--line); background:var(--panel); outline:none; }
.input:focus,.select:focus,.textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
.toolbar .input { max-width:300px; } .toolbar .select { width:auto; }
.textarea { min-height:70px; resize:vertical; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--panel); }
.seg button { border:0; background:transparent; padding:7px 13px; cursor:pointer; font-weight:600; font-size:13px; color:var(--soft); }
.seg button.on { background:var(--brand-soft); color:var(--brand); }
.muted { color:var(--soft); } .right { text-align:right; } .nowrap { white-space:nowrap; } .strong { font-weight:600; }
.empty { padding:44px 20px; text-align:center; color:var(--soft); }
.empty b { display:block; color:var(--ink); font-size:15px; margin-bottom:4px; }

/* badges */
.badge { --c:#64748b; display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; color:var(--c); background:color-mix(in srgb,var(--c) 15%,transparent); white-space:nowrap; }
.b-BOOKED,.b-SENT,.b-APPROVED { --c:#3b82f6; } .b-DISPATCHED { --c:#8b5cf6; }
.b-IN_TRANSIT,.b-PENDING,.b-PENDING_APPROVAL,.b-ON_LEAVE { --c:var(--warn); }
.b-DELIVERED,.b-ACTIVE,.b-SIGNED,.b-PAID { --c:var(--good); } .b-INVOICED { --c:#0d9488; }
.b-CANCELLED,.b-OVERDUE { --c:var(--bad); } .b-INACTIVE,.b-DRAFT,.b-VOID { --c:#64748b; }

/* tables */
.tbl-wrap { overflow-x:auto; }
table.tbl { width:100%; border-collapse:collapse; }
.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--soft); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
.tbl td { padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.tbl tbody tr:hover { background:var(--panel2); }
.tbl td.act { text-align:right; white-space:nowrap; } .tbl td.act .btn + .btn { margin-left:4px; }
@media (max-width:720px) {
  .tbl thead { display:none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display:block; width:100%; }
  .tbl tr { padding:10px 14px; border-bottom:1px solid var(--line); } .tbl tr:last-child { border-bottom:0; }
  .tbl td { display:flex; justify-content:space-between; gap:14px; padding:4px 0; border:0; text-align:right; }
  .tbl td::before { content:attr(data-label); color:var(--soft); font-size:12px; text-align:left; flex:none; }
  .tbl td.act { justify-content:flex-end; padding-top:8px; } .tbl td.act::before { display:none; }
}

/* board */
.board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px,1fr); gap:14px; overflow-x:auto; padding-bottom:10px; align-items:start; }
.col { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:120px; }
.col.over { outline:2px dashed var(--brand); outline-offset:-4px; }
.col-h { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 10px; font-weight:700; font-size:12.5px; }
.col-h span { color:var(--soft); font-weight:600; }
.lcard { display:block; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:9px; cursor:grab; color:inherit; text-decoration:none; }
.lcard:hover { border-color:var(--brand); text-decoration:none; }
.lcard.dragging { opacity:.4; }
.lcard .ref { font-weight:700; color:var(--brand); font-size:13px; } .lcard .route { margin:4px 0; font-weight:600; } .lcard .meta { color:var(--soft); font-size:12px; display:flex; justify-content:space-between; gap:8px; }

/* forms / modal */
.modal-back { position:fixed; inset:0; background:rgba(3,7,18,.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100; }
.modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:640px; box-shadow:var(--shadow); }
.modal.wide { max-width:820px; }
.modal-h { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
.modal-h h2 { font-size:17px; }
.modal-b { padding:20px; } .modal-f { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .form-grid .full { grid-column:1/-1; }
@media (max-width:640px) { .form-grid { grid-template-columns:1fr; } }
label.f { display:block; font-size:12.5px; font-weight:600; color:var(--soft); margin-bottom:5px; } label.f i { color:var(--bad); font-style:normal; }
.checkbox-field { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
.checkbox-field input { width:16px; height:16px; accent-color:var(--brand); }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; align-items:center; }
.toast { background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; box-shadow:var(--shadow); }
.toast.error { background:var(--bad); color:#fff; }

/* detail */
.kv { display:grid; grid-template-columns:130px 1fr; gap:8px 14px; } .kv dt { color:var(--soft); } .kv dd { margin:0; font-weight:500; }
.timeline { list-style:none; margin:0; padding:0; } .timeline li { position:relative; padding:0 0 16px 22px; }
.timeline li::before { content:""; position:absolute; left:4px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--brand); }
.timeline li::after { content:""; position:absolute; left:8px; top:16px; bottom:0; width:1px; background:var(--line); } .timeline li:last-child::after { display:none; }
.doc-row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); } .doc-row:last-child { border-bottom:0; }

/* charts */
.bars { display:flex; align-items:flex-end; gap:14px; height:200px; padding:10px 4px 0; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0; }
.bar-pair { display:flex; align-items:flex-end; gap:4px; width:100%; height:100%; justify-content:center; }
.bar { width:100%; max-width:34px; border-radius:6px 6px 0 0; background:var(--brand); min-height:2px; } .bar.alt { background:color-mix(in srgb,var(--brand) 35%,var(--panel2)); }
.bar-lab { font-size:11.5px; color:var(--soft); }
.hbar { margin:0 0 12px; } .hbar .r { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; } .hbar .t { height:8px; border-radius:9px; background:var(--panel2); overflow:hidden; } .hbar .t i { display:block; height:100%; background:var(--brand); border-radius:9px; }
.legend { display:flex; gap:14px; font-size:12px; color:var(--soft); margin-bottom:6px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; background:var(--brand); } .legend i.alt { background:color-mix(in srgb,var(--brand) 35%,var(--panel2)); }

/* access-code screen */
.lock { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:300; padding:16px; }
.lock .card { width:100%; max-width:380px; padding:26px; } .lock h1 { font-size:20px; margin:12px 0 4px; } .lock .err { color:var(--bad); margin:8px 0 0; min-height:1.2em; }
#saving { color:var(--brand); font-weight:600; min-height:1.2em; }

.or { text-align:center; color:var(--soft); margin:14px 0; font-size:12px; }
.nav-foot .strong { color:var(--ink); }

body.local .refresh-btn { display:none; }
.city-wrap { position:relative; }
.suggest { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:60; max-height:260px; overflow:auto; }
.suggest[hidden] { display:none; }
.sug { display:flex; justify-content:space-between; gap:12px; width:100%; text-align:left; background:none; border:0; padding:9px 12px; cursor:pointer; color:var(--ink); font:inherit; }
.sug:hover,.sug:focus { background:var(--panel2); outline:none; }
.sug-note { padding:10px 12px; color:var(--soft); font-size:13px; }
.geo-info { padding:10px 12px; border-radius:9px; background:var(--panel2); font-size:13px; }
.map { height:340px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.summary { display:flex; flex-wrap:wrap; gap:10px 28px; padding:12px 18px; margin-bottom:14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
.summary b { font-size:17px; display:block; } .summary span { color:var(--soft); font-size:12px; }
.fdate { display:inline-flex; align-items:center; gap:6px; color:var(--soft); font-size:12px; } .fdate .input { width:auto; }

.offline { position:sticky; top:0; z-index:35; background:var(--warn); color:#1a1200; text-align:center; padding:8px 14px; font-weight:600; font-size:13px; }
.offline[hidden] { display:none; }
.btn, .seg button, .nav a { touch-action: manipulation; }
/* installed on a phone with a notch / home bar: keep content clear of it */
@supports (padding: env(safe-area-inset-top)) {
  .topbar { padding-top: calc(12px + env(safe-area-inset-top)); padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  .sidebar { padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .content { padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
  #toast { bottom: calc(20px + env(safe-area-inset-bottom)); }
}

/* printable documents */
.doc { background:#fff; color:#111; padding:34px; border-radius:8px; border:1px solid #ddd; font-size:13px; }
.doc h1 { font-size:22px; margin-bottom:2px; } .doc .sub { color:#666; }
.doc .row { display:flex; justify-content:space-between; gap:24px; margin:20px 0; } .doc h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#666; margin-bottom:4px; }
.doc table { width:100%; border-collapse:collapse; margin:14px 0; } .doc th,.doc td { text-align:left; padding:8px 6px; border-bottom:1px solid #ddd; } .doc .total { font-size:18px; font-weight:700; }
.doc .sig { display:flex; gap:40px; margin-top:44px; } .doc .sig div { flex:1; border-top:1px solid #111; padding-top:6px; color:#555; font-size:12px; }
@media print {
  body > *:not(#modal-root) { display:none !important; }
  .modal-back { position:static; background:none; padding:0; display:block; }
  .modal { border:0; box-shadow:none; max-width:none; } .modal-h,.modal-f,.no-print { display:none !important; } .modal-b { padding:0; }
  .doc { border:0; padding:0; }
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="offline" id="offline" role="status" hidden>You're offline — you can look around, but changes can't be saved until you're back online.</div>
    <div class="topbar">
      <button class="btn sm" data-action="nav-toggle" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
      <strong>Haulwise Dispatch</strong>
      <button class="btn sm refresh-btn" data-action="refresh" style="margin-left:auto">↻ Refresh</button>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="scrim" data-action="nav-toggle"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="csv-file" accept=".csv,text/csv" hidden>
<input type="file" id="json-file" accept=".json,application/json" hidden>

<script>
"use strict";
/* =====================================================================
   1. CONFIG
   ===================================================================== */
const CONFIG = {
  // Your Google Apps Script web-app URL (ends in /exec). See README.md.
  sheetsUrl: "https://script.google.com/macros/s/AKfycbwyuuYwNBfULphLwf58KTxEsrIQ0HLt8913bC0-DNrUxweT0hGaYCGtusFwI1Rf_q0c6g/exec",
  // OAuth client id for "Continue with Google" (README, step "Sign in with Google"). Empty = button hidden.
  googleClientId: "",
  storageKey: "haulwise-dispatch-v3"
};
const SHEETS_URL = (localStorage.getItem("hw-sheets-url") || CONFIG.sheetsUrl || "").trim();
let me = null, ownerSheetUrl = "", roster = [];        // the signed-in person (role decides what they see), and the sheet link (owner only)

/* =====================================================================
   2. DATABASE ADAPTER  — the ONLY part that talks to a database.
   ---------------------------------------------------------------------
   An adapter has two async methods:

     loadAll()   -> { brokers:[…], carriers:[…], drivers:[…], loads:[…],
                      tracking:[…], invoices:[…], settlements:[…] }
     save(ops)   -> saves a batch of changes, in order:
                      {op:"create", table, row}
                      {op:"update", table, id, patch}
                      {op:"remove", table, id}

   "sheets" sends them to the Google Apps Script in apps-script/Code.gs, which keeps
   one tab per table. "local" keeps everything in this browser (used until a Sheets
   URL is set). Each user action is sent as ONE batch, so a save is a single request.
   ===================================================================== */
function applyOps(data, ops) {
  for (const o of ops) {
    const rows = (data[o.table] ||= []);
    if (o.op === "create") rows.push(o.row);
    else if (o.op === "update") { const r = rows.find(x => x.id === o.id); if (r) Object.assign(r, o.patch); }
    else if (o.op === "remove") { const i = rows.findIndex(x => x.id === o.id); if (i >= 0) rows.splice(i, 1); }
  }
}
const adapters = {
  local: {
    name: "local",
    async loadAll() { try { return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {}; } catch { return {}; } },
    async save(ops) { const d = await this.loadAll(); applyOps(d, ops); localStorage.setItem(CONFIG.storageKey, JSON.stringify(d)); }
  },
  sheets: {
    name: "sheets",
    async call(payload) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
      try {
        // text/plain keeps this a "simple" request, so the browser doesn't need a CORS preflight
        const res = await fetch(SHEETS_URL, { method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, signal: ctl.signal,
          body: JSON.stringify({token: localStorage.getItem("hw-token") || "", ...payload}) });
        let json; try { json = await res.json(); } catch { throw new Error("Google sent back a web page instead of data. In Apps Script: paste the latest Code.gs, then Deploy → Manage deployments → Edit → New version, with access set to “Anyone”."); }
        if (json.error) { const e = new Error(json.error); e.code = json.code || "server"; throw e; }
        return json;
      } catch (e) {
        if (e.name === "AbortError") throw new Error("Google Sheets took too long to respond.");
        if (e instanceof TypeError) throw new Error("Couldn't reach Google Sheets. Check your connection and the web-app URL.");
        throw e;
      } finally { clearTimeout(timer); }
    },
    async loadAll() { const j = await this.call({action: "loadAll"}); me = j.user; ownerSheetUrl = j.sheetUrl || ""; roster = j.roster || []; if (j.users) { team.users = j.users; team.error = ""; } return j.data; },
    async save(ops) { await this.call({action: "save", ops}); }
  }
};
const db = SHEETS_URL ? adapters.sheets : adapters.local;

/* =====================================================================
   3. STATE + HELPERS
   ===================================================================== */
const TABLES = ["brokers","carriers","drivers","loads","tracking","invoices","settlements"];
const state = Object.fromEntries(TABLES.map(t => [t, []]));
const ui = { q:"", status:"", tab:"invoices", loadsView: localStorage.getItem("hw-loads-view") || "board", f: {}, keepFilters: false };
const LOAD_STATUSES = ["BOOKED","DISPATCHED","IN_TRANSIT","DELIVERED","INVOICED","CANCELLED"];
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, kind = "") {

/* Every user action runs inside act(): changes are applied to the screen at once and queued,
   then saved to the database as ONE batch. If saving fails, the screen is reloaded from the database. */
let queue = [], savingCount = 0, saveChain = Promise.resolve(), lastLoad = 0;
let busyMsg = "", refreshing = false;
function updateSaving() { const el = $("#saving"); if (el) el.textContent = savingCount ? "Saving…" : busyMsg; }
function setBusy(msg) { busyMsg = msg; updateSaving(); }
async function resync(snap) {
  try { await loadAll(); }
  catch (e) { console.error(e); if (snap) { const before = JSON.parse(snap); TABLES.forEach(t => { state[t] = before[t] || []; }); } }   // couldn't re-read: undo the screen change
}
async function act(fn, okMsg) {
  if (SHEETS_URL && !navigator.onLine) { toast("You're offline — reconnect to save changes.", "error"); return; }
  const snap = SHEETS_URL ? JSON.stringify(state) : null;
  queue = [];
  try { await fn(); }
  catch (e) {
    console.error(e); const dirty = queue.length > 0; queue = [];
    toast(e.message || "Something went wrong", "error");
    if (e.code === "auth") return showAuth(e.message);
    if (dirty) await resync(snap);
    return render();
  }
  const ops = queue; queue = [];
  render(); if (okMsg) toast(okMsg); saveCache();
  if (!ops.length) return;
  savingCount++; updateSaving();
  saveChain = saveChain.then(() => db.save(ops)).catch(async e => {
    console.error(e); toast("Couldn't save: " + e.message, "error");
    if (e.code === "auth") showAuth(e.message); else { await resync(snap); render(); }
  }).finally(() => { savingCount--; updateSaving(); });
}

/* Data helpers: change the in-memory state right away and queue the matching database operation.
   The sheets also get readable name columns (brokerName, route, …) so they make sense in Excel. */
const nm = (t, id) => byId(t, id)?.name || "";
const ref = id => byId("loads", id)?.ref || "";
const DENORM = {
  loads: r => ({brokerName: nm("brokers", r.brokerId), ...carrierLink(), driverName: nm("drivers", r.driverId),
                route: `${r.pickupLocation || ""} → ${r.deliveryLocation || ""}`, margin: Math.round((Number(r.brokerRate || 0) - Number(r.carrierRate || 0)) * 100) / 100,
                rpm: perMile(r.brokerRate, r.miles), carrierRpm: perMile(r.carrierRate, r.miles)}),
  drivers: r => ({...carrierLink()}),
  tracking: r => ({loadRef: ref(r.loadId)}),
  invoices: r => ({loadRef: ref(r.loadId), brokerName: nm("brokers", r.brokerId)}),
  settlements: r => ({loadRef: ref(r.loadId), ...carrierLink()})
};
function createRow(t, data) {
  const now = new Date().toISOString();
  const base = {id: uid(), createdAt: now, updatedAt: now, ...data};
  const row = {...base, ...(DENORM[t] ? DENORM[t](base) : {})};
  state[t].push(row); queue.push({op: "create", table: t, row}); return row;
}
function updateRow(t, id, patch) {
  const cur = byId(t, id); if (!cur) return;
  const p = {...patch, updatedAt: new Date().toISOString()};
  Object.assign(p, DENORM[t] ? DENORM[t]({...cur, ...p}) : {});
  Object.assign(cur, p); queue.push({op: "update", table: t, id, patch: p});
  const fk = {brokers: "brokerId", drivers: "driverId"}[t];
  if (fk && "name" in patch) for (const tb of ["loads", "drivers", "invoices", "settlements"])
    for (const r of state[tb]) if (r[fk] === id && DENORM[tb]) { const d = DENORM[tb](r); if (Object.keys(d).some(k => d[k] !== r[k])) { Object.assign(r, d); queue.push({op: "update", table: tb, id: r.id, patch: d}); } }
  return cur;
}
function removeRow(t, id) { state[t] = state[t].filter(r => r.id !== id); queue.push({op: "remove", table: t, id}); }
async function loadAll() { const data = await db.loadAll(); TABLES.forEach(t => { state[t] = data[t] || []; }); lastLoad = Date.now(); saveCache(); }

/* A typed broker name is matched to a saved broker (ignoring case/extra spaces) or saved as a new one,
   so it shows up as a suggestion on every device the next time. */
function ensureBroker(name) {
  const n = String(name || "").replace(/\s+/g, " ").trim(); if (!n) return null;
  return (state.brokers.find(c => c.name.toLowerCase() === n.toLowerCase()) || createRow("brokers", {name: n})).id;
}
function nextNumber(prefix, table, field) {
  let max = 10000;
  for (const r of state[table]) { const m = String(r[field] || "").match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); }
  return `${prefix}-${max + 1}`;
}

const addTrack = (loadId, status, location, note) => createRow("tracking", {loadId, status, location: location || "", note: note || "", at: new Date().toISOString()});

/* =====================================================================
   3c. MAPS — city suggestions, driving miles, rate per mile (RPM)
   Free, key-less services called straight from the browser: Photon (OpenStreetMap data) for
   city suggestions and the public OSRM server for driving distance. Answers are cached on this
   device. If a service can't be reached the site still works: type the city and the miles by hand.
   ===================================================================== */
const GEO = {suggest: "https://photon.komoot.io/api/", route: "https://router.project-osrm.org/route/v1/driving/", bbox: "-170,14,-50,72"};
const STATE_ABBR = {Alabama:"AL",Alaska:"AK",Arizona:"AZ",Arkansas:"AR",California:"CA",Colorado:"CO",Connecticut:"CT",Delaware:"DE",Florida:"FL",Georgia:"GA",Hawaii:"HI",Idaho:"ID",Illinois:"IL",Indiana:"IN",Iowa:"IA",Kansas:"KS",Kentucky:"KY",Louisiana:"LA",Maine:"ME",Maryland:"MD",Massachusetts:"MA",Michigan:"MI",Minnesota:"MN",Mississippi:"MS",Missouri:"MO",Montana:"MT",Nebraska:"NE",Nevada:"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND",Ohio:"OH",Oklahoma:"OK",Oregon:"OR",Pennsylvania:"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",Tennessee:"TN",Texas:"TX",Utah:"UT",Vermont:"VT",Virginia:"VA",Washington:"WA","West Virginia":"WV",Wisconsin:"WI",Wyoming:"WY","District of Columbia":"DC",Ontario:"ON",Quebec:"QC","British Columbia":"BC",Alberta:"AB",Manitoba:"MB",Saskatchewan:"SK","Nova Scotia":"NS","New Brunswick":"NB","Newfoundland and Labrador":"NL","Prince Edward Island":"PE"};
const geoCache = (() => { try { return JSON.parse(localStorage.getItem("hw-geo")) || {q: {}, r: {}}; } catch { return {q: {}, r: {}}; } })();
function saveGeoCache() {
  for (const k of ["q", "r"]) { const keys = Object.keys(geoCache[k]); if (keys.length > 300) keys.slice(0, keys.length - 300).forEach(x => delete geoCache[k][x]); }
  try { localStorage.setItem("hw-geo", JSON.stringify(geoCache)); } catch {}
}
async function fetchJson(url, ms = 7000) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try { const res = await fetch(url, {signal: ctl.signal}); if (!res.ok) throw new Error("HTTP " + res.status); return await res.json(); } finally { clearTimeout(timer); }
}
/* "chic" -> [{label:"Chicago, IL", sub:"Cook County", lat, lng}, …] */
async function citySuggest(text) {
  const q = String(text || "").trim(); if (q.length < 2) return [];
  const key = q.toLowerCase(); if (geoCache.q[key]) return geoCache.q[key];
  const [name, hintRaw] = q.split(",").map(x => x.trim()), hint = (hintRaw || "").toLowerCase();       // "Reno, NV": search "Reno", prefer Nevada
  const j = await fetchJson(`${GEO.suggest}?q=${encodeURIComponent(name)}&limit=10&lang=en&bbox=${GEO.bbox}&osm_tag=place:city&osm_tag=place:town`);
  const seen = new Set(), out = [];
  for (const f of j.features || []) {
    const p = f.properties || {}; if (!["US", "CA", "MX"].includes(p.countrycode) || !p.name) continue;
    const st = STATE_ABBR[p.state] || p.state || "", lab = ["US", "CA"].includes(p.countrycode) ? `${p.name}, ${st}` : `${p.name}, ${st}, ${p.countrycode}`;
    if (seen.has(lab)) continue; seen.add(lab);
    const [lng, lat] = f.geometry.coordinates;
    out.push({label: lab, sub: p.county || p.state || "", lat: +lat.toFixed(5), lng: +lng.toFixed(5), match: hint && st.toLowerCase().startsWith(hint) ? 1 : 0});
  }
  out.sort((a, b) => b.match - a.match);
  geoCache.q[key] = out; saveGeoCache(); return out;
}
const haversineMiles = (a, b) => { const R = 3958.8, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
/* driving miles between two points; falls back to an estimate (straight line x 1.2) if routing is unreachable */
async function drivingMiles(a, b) {
  const key = [a.lat, a.lng, b.lat, b.lng].map(n => Number(n).toFixed(3)).join(",");
  if (geoCache.r[key]) return geoCache.r[key];
  try {
    const j = await fetchJson(`${GEO.route}${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);
    const res = {miles: Math.round(j.routes[0].distance * 0.000621371 * 10) / 10, estimated: false};
    geoCache.r[key] = res; saveGeoCache(); return res;
  } catch { return {miles: Math.round(haversineMiles(a, b) * 1.2 * 10) / 10, estimated: true}; }
}
const perMile = (amount, miles) => Number(miles) > 0 ? Math.round(Number(amount || 0) / Number(miles) * 100) / 100 : null;
const ymd = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };

const geoUI = {pickup: [], delivery: []}, cityTimers = {};
const ptOf = (form, which) => { const a = form.elements[which + "Lat"]?.value, b = form.elements[which + "Lng"]?.value; return a !== "" && b !== "" && a != null && b != null ? {lat: +a, lng: +b} : null; };
function renderRpm(form) {
  const box = $("#geo-summary", form); if (!box) return;
  const miles = Number(form.elements.miles?.value), br = Number(form.elements.brokerRate?.value || 0), cr = Number(form.elements.carrierRate?.value || 0);
  if (!(miles > 0)) { box.innerHTML = `<span class="muted">Pick the pickup and delivery city from the suggestions to get the driving miles and rate per mile — or type the miles yourself.</span>`; return; }
  const a = perMile(br, miles), b = perMile(cr, miles), c = perMile(br - cr, miles), fmt = v => v == null ? "—" : "$" + v.toFixed(2);
  box.innerHTML = `<b>${miles.toLocaleString()} mi</b>${form.dataset.est ? ' <span class="muted">(estimated)</span>' : ""} &nbsp;·&nbsp; Broker RPM <b>${fmt(a)}/mi</b> &nbsp;·&nbsp; Carrier RPM <b>${fmt(b)}/mi</b> &nbsp;·&nbsp; Margin <b>${money(br - cr)}</b> <span class="muted">(${fmt(c)}/mi)</span>`;
}
async function updateMiles(form, force) {
  const a = ptOf(form, "pickup"), b = ptOf(form, "delivery"); if (!a || !b) return renderRpm(form);
  if (form.dataset.manual === "1" && !force) return renderRpm(form);
  const seq = form.dataset.seq = String((+form.dataset.seq || 0) + 1), box = $("#geo-summary", form); if (box) box.innerHTML = `<span class="muted">Calculating driving miles…</span>`;
  const r = await drivingMiles(a, b);
  if (form.dataset.seq !== seq) return;                       // a newer lookup replaced this one (the form may already be closed: still fill it in)
  form.elements.miles.value = r.miles; form.dataset.est = r.estimated ? "1" : ""; form.dataset.manual = ""; renderRpm(form);
}
async function showSuggestions(input) {
  const which = input.dataset.city, box = $("#sug-" + which), text = input.value;
  if (!box) return; if (text.trim().length < 2) { box.hidden = true; return; }
  box.hidden = false; box.innerHTML = `<div class="sug-note">Searching…</div>`;
  let list; try { list = await citySuggest(text); } catch { if (input.value === text) box.innerHTML = `<div class="sug-note">Suggestions unavailable right now — type the city yourself.</div>`; return; }
  if (input.value !== text) return;                                    // they kept typing
  geoUI[which] = list;
  box.innerHTML = list.length ? list.map((c, i) => `<button type="button" class="sug" data-action="pick-city" data-which="${which}" data-i="${i}"><b>${esc(c.label)}</b><span class="muted">${esc(c.sub)}</span></button>`).join("") : `<div class="sug-note">No match — you can still type it.</div>`;
}
function pickCity(which, c) {
  const form = $("#entity-form"); if (!form) return;
  form.elements[which + "Location"].value = c.label; form.elements[which + "Lat"].value = c.lat; form.elements[which + "Lng"].value = c.lng;

}
/* on Save: a typed city that wasn't picked from the list gets looked up, and missing miles are filled in */
async function ensureGeo(form) {
  for (const which of ["pickup", "delivery"]) {
    const text = form.elements[which + "Location"].value.trim();
    if (text && !ptOf(form, which)) { try { const c = (await citySuggest(text))[0]; if (c) { form.elements[which + "Lat"].value = c.lat; form.elements[which + "Lng"].value = c.lng; } } catch {} }
  }
  if (ptOf(form, "pickup") && ptOf(form, "delivery") && (form.elements.miles.value === "")) await updateMiles(form, true);
}
let routeMap = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, fail) => {
    if (!document.getElementById("leaflet-css")) { const c = document.createElement("link"); c.id = "leaflet-css"; c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c); }
    const el = document.createElement("script"); el.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; el.onload = ok; el.onerror = () => fail(new Error("map library")); document.head.appendChild(el);
  });
}
async function initRouteMap() {
  if (routeMap) { routeMap.remove(); routeMap = null; }
  const el = $("#route-map"); if (!el) return;
  const l = byId("loads", el.dataset.load); if (!l) return;
  try { await loadLeaflet(); } catch { el.innerHTML = `<div class="empty">The map couldn't be loaded.</div>`; return; }
  if (!el.isConnected) return;
  const L = window.L, a = [l.pickupLat, l.pickupLng], b = [l.deliveryLat, l.deliveryLng];
  routeMap = L.map(el, {scrollWheelZoom: false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap contributors"}).addTo(routeMap);
  L.marker(a).addTo(routeMap).bindPopup("Pickup: " + l.pickupLocation); L.marker(b).addTo(routeMap).bindPopup("Delivery: " + l.deliveryLocation);
  const line = L.polyline([a, b], {color: "#3b6cf6", weight: 3, dashArray: "6 6"}).addTo(routeMap);
  routeMap.fitBounds(line.getBounds(), {padding: [30, 30]});
  try {                                                                 // replace the straight line with the real road route
    const j = await fetchJson(`${GEO.route}${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
    if (routeMap && el.isConnected) { routeMap.removeLayer(line); const road = L.polyline(j.routes[0].geometry.coordinates.map(([x, y]) => [y, x]), {color: "#3b6cf6", weight: 4}).addTo(routeMap); routeMap.fitBounds(road.getBounds(), {padding: [30, 30]}); }
  } catch {}
}

function fieldHtml(f, val) {

  const lab = `<label class="f" for="${id}">${esc(f.l)}${f.req ? " <i>*</i>" : ""}</label>`;
  let ctl;
  if (f.t === "textarea") ctl = `<textarea class="textarea" id="${id}" name="${f.k}" ${req}>${esc(v)}</textarea>`;
  else if (f.t === "select") ctl = `<select class="select" id="${id}" name="${f.k}" ${req}>${f.opts.map(o => `<option value="${o}" ${o === v ? "selected" : ""}>${esc(label(o))}</option>`).join("")}</select>`;
  else if (f.t === "ref") {
    const rows = [...state[f.ref]].sort((a, b) => f.ref === "loads" ? newest(a, b) : (a.name || "").localeCompare(b.name || ""));
    ctl = `<select class="select" id="${id}" name="${f.k}" ${req}><option value="">${f.req ? "Select…" : "— None —"}</option>${rows.map(r =>
      `<option value="${r.id}" ${r.id === v ? "selected" : ""}>${esc(f.ref === "loads" ? loadLabel(r) : r.name)}</option>`).join("")}</select>`;
  } else if (f.t === "broker") ctl = `<input class="input" id="${id}" name="${f.k}" list="broker-list" value="${esc(v)}" placeholder="${esc(f.ph || "")}" autocomplete="off" ${req}><datalist id="broker-list">${[...state.brokers].sort((a, b) => a.name.localeCompare(b.name)).map(c => `<option value="${esc(c.name)}">`).join("")}</datalist>`;
  else if (f.t === "hidden") return `<input type="hidden" name="${f.k}" value="${esc(v)}">`;
  else if (f.t === "geoinfo") return `<div class="full"><div class="geo-info" id="geo-summary"></div></div>`;
  else if (f.t === "city") ctl = `<div class="city-wrap"><input class="input" id="${id}" name="${f.k}" data-city="${f.geo}" value="${esc(v)}" placeholder="${esc(f.ph || "")}" autocomplete="off" ${req}><div class="suggest" id="sug-${f.geo}" hidden></div></div>`;
  else if (f.t === "driver") ctl = driverSelect(id, f, v, req);
  else if (f.t === "dispatcher") { if (!canAssign()) return ""; ctl = dispatcherSelect(id, f, v); }
  else if (f.t === "equip") ctl = `<input class="input" id="${id}" name="${f.k}" list="equip-list" value="${esc(v)}"><datalist id="equip-list">${EQUIPMENT.map(e => `<option value="${e}">`).join("")}</datalist>`;

  return `<div class="${f.full ? "full" : ""}">${lab}${ctl}</div>`;

function driverSelect(id, f, v, req) {

}

function openForm(table, id, preset = {}) {
  const E = ENT[table], row = id ? byId(table, id) : null;
  let data = row || preset;
  if (!row && table === "loads") { data.pickupDate ||= addDays(1).toISOString(); data.deliveryDate ||= addDays(2).toISOString(); data.dispatcherEmail ||= me?.email; }
  if (table === "loads" && !("brokerInput" in data)) data = {...data, brokerInput: nm("brokers", data.brokerId)};
  if (!row && table === "invoices") data.dueDate ||= addDays(30).toISOString().slice(0, 10);
  const body = `<form id="entity-form" data-table="${table}" data-id="${id || ""}"><div class="form-grid">${E.fields.map(f => fieldHtml(f, data[f.k])).join("")}</div></form>`;
  openModal(`${row ? "Edit" : "New"} ${E.title.toLowerCase()}`, body,
    `<button class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit" form="entity-form">${row ? "Save changes" : "Create"}</button>`);
  if (table === "loads") renderRpm($("#entity-form"));
}

function readForm(form, table) {
  const out = {};
  for (const f of ENT[table].fields) {
    const el = form.elements[f.k]; if (!el) continue;                       // some fields aren't shown to every role
    if (f.t === "checkbox") { out[f.k] = el.checked; continue; }
    const raw = el.value;
    if (f.t === "number" || f.t === "hidden") out[f.k] = raw === "" ? null : Number(raw);
    else if (f.t === "datetime-local") out[f.k] = raw ? new Date(raw).toISOString() : null;
    else out[f.k] = raw.trim() === "" ? null : raw.trim();
  }
  return out;
}

async function saveEntity(table, id, data) {
  if (table === "carriers") { if (!id && carrier()) throw new Error("The carrier is already set up — edit it instead."); if (!id) data.status = "ACTIVE"; }
  if (table === "loads") {
    data.ref ||= nextNumber("LD", "loads", "ref");
    if (state.loads.some(l => l.ref === data.ref && l.id !== id)) throw new Error(`Reference ${data.ref} already exists.`);
    data.brokerRate ??= 0; data.carrierRate ??= 0;
    if ("brokerInput" in data) { data.brokerId = ensureBroker(data.brokerInput); delete data.brokerInput; }
    if (!id) data.dispatcherEmail ||= me?.email || null;                     // a load is saved under the name of whoever adds it
    if ("dispatcherEmail" in data) data.dispatcherName = dispatcherName(data.dispatcherEmail);
  }
  if (table === "drivers" && "dispatcherEmail" in data) data.dispatcherName = dispatcherName(data.dispatcherEmail);
  if (table === "invoices") {
    const l = byId("loads", data.loadId);
    if (!l?.brokerId) throw new Error("This load has no broker yet. Edit the load and type the broker name first.");
    data.brokerId = l.brokerId;
  }
  if (!id && table === "invoices") data.invoiceNumber = nextNumber("INV", "invoices", "invoiceNumber");
  if (table === "carriers") { if (id) updateRow(table, id, data); else createRow(table, data); syncCarrier(); return; }
  if (id) {
    const oldStatus = byId(table, id).status;
    updateRow(table, id, data);
    if (table === "loads" && data.status !== oldStatus) addTrack(id, data.status, data.pickupLocation, `Status updated to ${label(data.status)}.`);
  } else {
    const row = createRow(table, data);
    if (table === "loads") addTrack(row.id, row.status, row.pickupLocation, "Load created.");
    if (table === "invoices" && data.loadId) setLoadStatus(data.loadId, "INVOICED", "Invoice " + row.invoiceNumber + " created.");
  }
}

function setLoadStatus(id, status, note, location) {
  const l = byId("loads", id); if (!l || l.status === status) return;
  updateRow("loads", id, {status});
  addTrack(id, status, location || l.pickupLocation, note || `Status updated to ${label(status)}.`);
}

/* after the carrier's details change, refresh the carrier name/link stored on loads, drivers and settlements */
function syncCarrier() {
  const link = carrierLink();
  for (const tb of ["loads", "drivers", "settlements"]) for (const r of state[tb])
    if (r.carrierId !== link.carrierId || r.carrierName !== link.carrierName) { Object.assign(r, link); queue.push({op: "update", table: tb, id: r.id, patch: {...link}}); }
}

/* deletes honour the old database rules: loads cascade, carriers/brokers with paperwork are protected */
function deleteEntity(table, id) {
  if (table === "brokers" && state.invoices.some(i => i.brokerId === id)) throw new Error("This broker has invoices and can't be deleted.");
  if (table === "loads") for (const t of ["tracking", "invoices", "settlements"]) for (const r of state[t].filter(r => r.loadId === id)) removeRow(t, r.id);
  if (table === "brokers") for (const l of state.loads.filter(l => l.brokerId === id)) updateRow("loads", l.id, {brokerId: null});
  if (table === "drivers") for (const l of state.loads.filter(l => l.driverId === id)) updateRow("loads", l.id, {driverId: null});
  removeRow(table, id);
}

function dispatcherFilterOptions(rows) {

  return [...m].map(([e, n]) => [e, n + (me && e === me.email ? " (me)" : "")]).sort((a, b) => a[1].localeCompare(b[1]));
}
const dispatcherMatch = (rowEmail, f) => !f || (f === "__none" ? !rowEmail : rowEmail === f);
function loadMatches(l) {
  const f = ui.f, day = l.pickupDate ? ymd(l.pickupDate) : "";

  if (!dispatcherMatch(l.dispatcherEmail, f.dispatcher)) return false;
  if (f.broker && l.brokerId !== f.broker) return false;
  if (f.driver && l.driverId !== f.driver) return false;
  if (f.from && day < f.from) return false;
  if (f.to && day > f.to) return false;
  return !ui.q || [l.ref, l.pickupLocation, l.deliveryLocation, l.commodity, l.dispatcherName, nameOf("brokers", l.brokerId), nameOf("drivers", l.driverId)].join(" ").toLowerCase().includes(ui.q.toLowerCase());

function loadsSummary(rows) {
  const live = rows.filter(l => l.status !== "CANCELLED"), sum = (a, k) => a.reduce((s, l) => s + Number(l[k] || 0), 0);
  const gross = sum(live, "brokerRate"), cost = sum(live, "carrierRate"), withMiles = live.filter(l => Number(l.miles) > 0), miles = sum(withMiles, "miles"), rpm = perMile(sum(withMiles, "brokerRate"), miles);
  const chip = (k, v) => `<div><b>${v}</b><span>${k}</span></div>`;
  return `<div class="summary">${chip("Loads", live.length)}${chip("Gross (broker rate)", money(gross))}${chip("Carrier cost", money(cost))}${chip("Margin", money(gross - cost))}${chip("Avg RPM", rpm != null ? "$" + rpm.toFixed(2) + "/mi" : "—")}</div>`;
}
const ENTITY_FILTERS = {
  drivers: {ui: () => fSelect("status", "All statuses", STATUS_OPTS.driver.map(s => [s, label(s)])) + fSelect("dispatcher", "All dispatchers", [["__none", "Unassigned"], ...dispatcherFilterOptions(state.drivers)]),
            match: d => (!ui.f.status || d.status === ui.f.status) && dispatcherMatch(d.dispatcherEmail, ui.f.dispatcher)},
  brokers: {ui: () => fSelect("terms", "All payment terms", PAYMENT_TERMS.map(t => [t, t])) + fSelect("mc", "MC number", [["missing", "Needs MC"], ["ok", "Has MC"]]),
            match: b => (!ui.f.terms || b.paymentTerms === ui.f.terms) && (!ui.f.mc || (ui.f.mc === "missing" ? !b.mcNumber : !!b.mcNumber))}

function periodRange(p) {

const monthKey = d => (d || "").slice(0, 7);
function lastMonths(n) {

  return out;
}

}
function sumBy(rows, keyFn, valFn) { const o = {}; for (const r of rows) { const k = keyFn(r); if (k) o[k] = (o[k] || 0) + valFn(r); } return o; }

function dispatcherRows(loads) {
  const m = new Map();
  for (const l of loads) {
    const key = l.dispatcherEmail || "__none", r = m.get(key) || {email: key, name: l.dispatcherName || "No dispatcher", loads: 0, gross: 0, cost: 0, miles: 0, milesGross: 0};
    r.loads++; r.gross += Number(l.brokerRate || 0); r.cost += Number(l.carrierRate || 0);
    if (Number(l.miles) > 0) { r.miles += Number(l.miles); r.milesGross += Number(l.brokerRate || 0); }
    m.set(key, r);
  }
  return [...m.values()].sort((a, b) => b.gross - a.gross);
}

function pageReports() {
  const [from, to] = periodRange(ui.f.period);
  const loads = activeLoads().filter(l => { const day = l.pickupDate ? ymd(l.pickupDate) : ""; return (!from || day >= from) && (!to || day <= to); }), months = lastMonths(6);
  const rev = sumBy(loads, l => monthKey(l.pickupDate), l => Number(l.brokerRate)), cost = sumBy(loads, l => monthKey(l.pickupDate), l => Number(l.carrierRate));
  const totalRev = loads.reduce((s, l) => s + Number(l.brokerRate), 0), totalCost = loads.reduce((s, l) => s + Number(l.carrierRate), 0);
  const top = (obj, nameT) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, v]) => [nameOf(nameT, id), v]);
  const hbars = (items, fmt = money) => { const max = Math.max(1, ...items.map(i => i[1])); return items.map(([n, v]) => `<div class="hbar"><div class="r"><span>${esc(n)}</span><b>${fmt(v)}</b></div><div class="t"><i style="width:${(v / max) * 100}%"></i></div></div>`).join("") || `<div class="muted">No data yet.</div>`; };

  const stat = (k, v) => `<div class="card stat"><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`;
  return pageHead("Reports", "Revenue, cost and margin across your loads.", fSelect("period", "All time", [["month", "This month"], ["lastmonth", "Last month"], ["30", "Last 30 days"], ["90", "Last 90 days"], ["year", "This year"]])) +
  `<div class="grid g4">${stat("Revenue", money(totalRev))}${stat("Carrier cost", money(totalCost))}${stat("Gross margin", money(totalRev - totalCost))}${stat("Margin %", totalRev ? ((totalRev - totalCost) / totalRev * 100).toFixed(1) + "%" : "—")}</div>

  ${dispatcherCard(loads)}

}

document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (!el) return; const fn = ACTIONS[el.dataset.action]; if (fn) { if (el.tagName === "A") e.preventDefault(); fn(el.dataset, e); } });

document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.id === "entity-form") {
    const {table: t, id} = f.dataset, btn = document.querySelector('[form="entity-form"]');
    (async () => {

      const data = readForm(f, t);
      await act(async () => { await saveEntity(t, id || null, data); closeModal(); }, id ? "Saved" : "Created");
      if (btn?.isConnected) btn.disabled = false;
    })();
  } else if (f.dataset.form === "tracking") {
    const fd = new FormData(f), l = byId("loads", f.dataset.id);
    act(() => { const st = fd.get("status"); updateRow("loads", l.id, {status: st}); addTrack(l.id, st, fd.get("location"), fd.get("note")); }, "Tracking updated");
  } else if (f.dataset.form === "sheets") {

  } else if (f.dataset.form === "signin") {

  } else if (f.dataset.form === "signup") {

const CSV_HEAD = ["Reference", "Status", "Broker", "Dispatcher", "Driver", "Pickup Location", "Pickup Date", "Delivery Location", "Delivery Date", "Commodity", "Weight (lbs)", "Equipment", "Broker Rate", "Carrier Rate", "Miles", "RPM", "Notes"];
function download(name, text, mime = "text/csv") { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + text], {type: mime + ";charset=utf-8"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const csvLine = a => a.map(v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",");
function exportCSV() {
  const rows = [...state.loads].sort(newest).filter(loadMatches).map(l => [l.ref, l.status, nameOf("brokers", l.brokerId).replace("—", ""), l.dispatcherName, nameOf("drivers", l.driverId).replace("—", ""),
    l.pickupLocation, l.pickupDate, l.deliveryLocation, l.deliveryDate, l.commodity, l.weightLbs, l.equipment, l.brokerRate, l.carrierRate, l.miles, l.rpm, l.notes]);
  download(`loads-${today()}.csv`, [CSV_HEAD, ...rows].map(csvLine).join("\r\n"));
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false; text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; } else cur += c; }
  if (cur || row.length) { row.push(cur); rows.push(row); } return rows.filter(r => r.some(x => x.trim()));
}
async function importCSV(text) {
  const [head, ...rows] = parseCSV(text); const ix = Object.fromEntries(head.map((h, i) => [h.trim().toLowerCase(), i]));
  if (ix["pickup location"] == null || ix["delivery location"] == null) throw new Error("This doesn't look like a loads export (needs “Pickup Location” and “Delivery Location” columns).");
  const alias = {"broker": "customer", "broker rate": "customer rate"};
  const get = (r, name) => { const k = name.toLowerCase(); return (r[ix[k] ?? ix[alias[k]]] ?? "").trim(); };
  const ensure = async (t, name) => { if (!name) return null; const f = state[t].find(x => x.name.toLowerCase() === name.toLowerCase()); return (f || await createRow(t, {name, ...(t === "drivers" ? {status: "ACTIVE"} : {})})).id; };
  let made = 0, updated = 0, bad = 0;
  for (const r of rows) {
    const pu = new Date(get(r, "Pickup Date")), de = new Date(get(r, "Delivery Date"));
    if (!get(r, "Pickup Location") || !get(r, "Delivery Location") || isNaN(pu) || isNaN(de)) { bad++; continue; }
    const st = get(r, "Status").toUpperCase(), ref = get(r, "Reference");
    const data = {status: LOAD_STATUSES.includes(st) ? st : "BOOKED", brokerId: await ensure("brokers", get(r, "Broker")), driverId: await ensure("drivers", get(r, "Driver")),
      pickupLocation: get(r, "Pickup Location"), pickupDate: pu.toISOString(), deliveryLocation: get(r, "Delivery Location"), deliveryDate: de.toISOString(), commodity: get(r, "Commodity") || null,
      weightLbs: get(r, "Weight (lbs)") ? Number(get(r, "Weight (lbs)")) : null, equipment: get(r, "Equipment") || null, brokerRate: Number(get(r, "Broker Rate")) || 0, carrierRate: Number(get(r, "Carrier Rate")) || 0, notes: get(r, "Notes") || null, miles: Number(get(r, "Miles")) > 0 ? Number(get(r, "Miles")) : null};
    const existing = ref && state.loads.find(l => l.ref === ref);
    if (existing) { updateRow("loads", existing.id, data); updated++; }
    else { const row = createRow("loads", {...data, ref: ref || nextNumber("LD", "loads", "ref"), dispatcherEmail: me?.email || null, dispatcherName: me?.name || null}); addTrack(row.id, data.status, data.pickupLocation, "Imported from CSV."); made++; }
  }
  toast(`Imported: ${made} new, ${updated} updated${bad ? `, ${bad} skipped` : ""}`);
}
$("#csv-file").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) f.text().then(t => act(() => importCSV(t))); });
$("#json-file").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  f.text().then(t => act(async () => { const d = JSON.parse(t); if (!confirm("Restore this backup? Existing records with the same id are kept as they are.")) return;
    for (const tb of TABLES) for (const r of d[tb] || []) if (r.id && !byId(tb, r.id)) { state[tb].push(r); queue.push({op: "create", table: tb, row: r}); } }, "Backup restored")); });

function setTheme(t) { document.documentElement.dataset.theme = t; localStorage.setItem("hw-theme", t); $("#theme-color")?.setAttribute("content", t === "dark" ? "#080d1c" : "#f4f6fb"); }
setTheme(localStorage.getItem("hw-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

async function boot() {
  document.body.classList.toggle("local", !SHEETS_URL); updateOffline();
  if (!SHEETS_URL) me = {email: "local", name: "This browser", role: "owner"};             // no backend: single-user local mode
  else if (!localStorage.getItem("hw-token")) { me = null; render(); return showAuth(); }
  const cached = SHEETS_URL ? readCache() : null;
  if (cached) {                                                                            // open instantly from the last copy, update in the background
    me = cached.me; roster = cached.roster || []; ownerSheetUrl = cached.ownerSheetUrl || ""; lastLoad = cached.at || 0;
    TABLES.forEach(t => { state[t] = cached.state?.[t] || []; });
    ui.f = defaultFilters(); render(); setBusy("Updating…");
  } else { ui.f = defaultFilters(); render(); $("#view").innerHTML = `<div class="empty"><b>Loading…</b>${SHEETS_URL ? "Reading your Google Sheet." : ""}</div>`; }
  try { await loadAll(); if (!cached) ui.f = defaultFilters(); render(); if (SHEETS_URL && can("team")) loadTeam(); }
  catch (e) {
    console.error(e);
    if (e.code === "auth") { localStorage.removeItem("hw-token"); localStorage.removeItem("hw-cache"); me = null; render(); return showAuth(e.message); }
    if (cached) { toast("Couldn't update — showing your last saved data. " + e.message, "error"); return; }
    $("#view").innerHTML = pageHead("Couldn't load data", "") + empty("Couldn't reach the database", e.message) + `<button class="btn primary" onclick="boot()">Try again</button>`;
  } finally { setBusy(""); }
}
/* pick up other people's changes: when the tab is focused again, and every 2 minutes */
async function refresh(force) {
  if (!SHEETS_URL || refreshing) return;
  if (!navigator.onLine) { if (force) toast("You're offline — showing your last saved data.", "error"); return; }
  if (!force && (savingCount || queue.length || Date.now() - lastLoad < 60000)) return;
  refreshing = true; setBusy("Updating…");
  document.querySelectorAll(".refresh-btn").forEach(b => { b.disabled = true; b.textContent = "↻ Updating…"; });
  try {
    if (force) await saveChain.catch(() => {});                   // let any save in progress finish first
    const before = JSON.stringify([state, me]), data = await db.loadAll();
    if (savingCount || queue.length) return;                      // the user changed something meanwhile: keep it
    TABLES.forEach(t => { state[t] = data[t] || []; }); lastLoad = Date.now(); saveCache();
    const changed = JSON.stringify([state, me]) !== before;
    if (force) toast(changed ? "Updated with the latest data" : "Already up to date");
    if ((changed || force) && !$("#entity-form") && document.activeElement?.id !== "search") render();
  } catch (e) { if (e.code === "auth") showAuth(e.message); else if (force) toast(e.message, "error"); }
  finally { refreshing = false; setBusy(""); document.querySelectorAll(".refresh-btn").forEach(b => { b.disabled = false; b.textContent = "↻ Refresh"; }); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 120000);
boot();
